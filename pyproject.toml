[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kohakuvllm"
version = "0.0.1"
description = "Our own frontend and kernels for small hybrid VLMs (Qwen3.5 / GDN) at full GPU load, with vLLM's engine as the backend; a drop-in vLLM plugin package"
authors = [
    { name = "Shih-Ying Yeh(KohakuBlueLeaf)", email = "apolloyeh0123@gmail.com" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"
# Follows upstream vLLM; TESTED.md names the last version every part was verified on.
dependencies = ["vllm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://kblueleaf.net/"
Repository = "https://github.com/KohakuBlueleaf/KohakuvLLM"

[project.optional-dependencies]
bench = ["httpx>=0.27", "pillow>=10"]
dev = ["ruff", "black"]

[project.entry-points."vllm.general_plugins"]
kohakuvllm = "kohakuvllm.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/kohakuvllm"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "bench"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "PERF", "RUF100", "PLC0415"]
ignore = ["B905", "PERF203"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 100
